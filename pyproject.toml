[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "complexmd-eval"
version = "0.3.1"
description = "MolWorld4D-Bench evaluation engine for generated protein-small-molecule MD trajectories"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Zinc-X"}]
maintainers = [{name = "Zinc-X"}]
keywords = [
  "molecular dynamics",
  "protein-ligand",
  "trajectory evaluation",
  "machine learning",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "numpy>=1.23",
  "pandas>=1.5",
  "scipy>=1.9",
  "PyYAML>=6",
  "matplotlib>=3.6",
]

[project.optional-dependencies]
trajectory = ["MDAnalysis>=2.6"]
advanced = ["mdtraj>=1.9", "networkx>=2.8"]
all = ["MDAnalysis>=2.6", "mdtraj>=1.9", "networkx>=2.8"]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/Zinc-X/MolWorld4D-Bench"
Repository = "https://github.com/Zinc-X/MolWorld4D-Bench"
Issues = "https://github.com/Zinc-X/MolWorld4D-Bench/issues"
Author = "https://github.com/Zinc-X"
ORCID = "https://orcid.org/0009-0008-6552-3247"

[project.scripts]
complexmd-eval = "complexmd_eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/complexmd-eval/plugin" = [".codex-plugin/plugin.json"]
"share/complexmd-eval/schemas" = ["schemas/*.json"]
"share/complexmd-eval/docs" = ["docs/*.md"]
"share/complexmd-eval/examples" = ["examples/*.yaml", "examples/*.py"]
"share/complexmd-eval/examples/demo_data" = ["examples/demo_data/*.npz"]
"share/complexmd-eval/skills/complexmd-eval" = ["skills/complexmd-eval/SKILL.md"]
"share/complexmd-eval/skills/complexmd-eval/agents" = ["skills/complexmd-eval/agents/*.yaml"]
"share/complexmd-eval/skills/complexmd-eval/references" = ["skills/complexmd-eval/references/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
