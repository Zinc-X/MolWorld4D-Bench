name: release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build and verify distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and release tools
        run: python -m pip install -e ".[all]" build twine
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Check runtime preflight
        run: complexmd-eval doctor --profile full --strict
      - name: Build wheel and source distribution
        run: python -m build
      - name: Check distribution metadata
        run: python -m twine check dist/*
      - name: Build Codex plugin archive
        run: python scripts/build_plugin_bundle.py --out-dir plugin-dist
      - uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - uses: actions/upload-artifact@v4
        with:
          name: codex-plugin-distribution
          path: plugin-dist/

  github-release:
    name: Attach distributions to GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: codex-plugin-distribution
          path: plugin-dist/
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" dist/* plugin-dist/* --clobber

  pypi-publish:
    name: Publish distributions to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/complexmd-eval
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish to PyPI with trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
