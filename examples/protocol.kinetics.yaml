protocol_version: "1.0"
suite: synthetic-protein-ligand-time-aware-demo
profile: kinetics

selections:
  ligand_resname: MOL
  alignment: protein_backbone

analysis:
  comparison_horizon: common
  max_timebase_coarsening: 20
  windows_ns: auto
  auto_windows:
    mode: fractions
    fractions: [0.1, 0.25, 0.5, 0.75, 1.0]
  tica_lag_ns: 2.5
  msm_lags_ns: [2.5, 5.0, 7.5]
  acf_max_lag_ns: 7.5
  bootstrap_block_ns: 2.5
  n_states: auto
  n_states_min: 2
  n_states_max: 6
  min_frames_per_state: 10
  tica_input_components: 10
  tica_components: 3
  min_transition_events: 5
  fes_bins: 20
  bootstrap_samples: 500

cases:
  - id: DEMO
    topology: self_describing.npz
    reference:
      dt_ns: 0.5
      trajectories:
        - demo_data/reference.npz
    predictions:
      - name: calibrated
        dt_ns: 0.5
        trajectories:
          - demo_data/prediction_good.npz
      - name: frozen
        dt_ns: 0.5
        analysis:
          n_states_max: 4
        trajectories:
          - demo_data/prediction_frozen.npz
